services:
  app:
    container_name: quacky
    image: ghcr.io/linuskang/quacky:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      VERSION: ${VERSION}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET}
      ORG_NAME: ${ORG_NAME}
      DESCRIPTION: ${DESCRIPTION}
      UPSTREAM_API_KEY: ${UPSTREAM_API_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
      AI_URL: ${AI_URL}
      AI_KEY: ${AI_KEY}
      AI_MODEL: ${AI_MODEL}
      QOTD: ${QOTD}
      LOGIN_BANNER_MESSAGE: ${LOGIN_BANNER_MESSAGE}
      RUSTFS_ENDPOINT: ${RUSTFS_ENDPOINT}
      RUSTFS_REGION: ${RUSTFS_REGION}
      RUSTFS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY_ID}
      RUSTFS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_ACCESS_KEY}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET}
      RUSTFS_PUBLIC_BASE_URL: ${RUSTFS_PUBLIC_BASE_URL}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_EMAIL: ${VAPID_EMAIL}
      PORT: ${PORT:-5431}
    ports:
      - "5431:5431"
    networks:
      - quacky_net
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - quacky_db:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - quacky_net
networks:
  quacky_net:
    driver: bridge
volumes:
  quacky_db: