name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deployment-config:
    name: Deployment Config
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check environment synchronization
        id: env-check
        run: |
          if node scripts/check-deployment-config.js; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail on drift
        if: steps.env-check.outputs.drift == 'true' && github.event_name == 'pull_request'
        run: exit 1

      - name: Auto-fix drift and commit
        if: steps.env-check.outputs.drift == 'true' && github.event_name != 'pull_request'
        run: |
          node scripts/check-deployment-config.js --fix
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .env.example production.docker-compose.yml
          git commit -m "fix: auto-resolve deployment config drift"
          git push

      - name: Check Compose files
        run: |
          trap 'rm -f .env' EXIT
          touch .env
          docker compose -f docker-compose.yml config --quiet
          docker compose -f production.docker-compose.yml config --quiet

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://localhost:5432/db
      BETTER_AUTH_SECRET: dummy-secret
      BETTER_AUTH_URL: http://localhost:3000
      GITHUB_CLIENT_ID: dummy-client-id
      GITHUB_CLIENT_SECRET: dummy-client-secret
      RESEND_API_KEY: dummy-api-key
      RESEND_EMAIL_FROM: dummy@example.com
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm run generate

      - name: Run type check
        run: pnpm run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://localhost:5432/db
      BETTER_AUTH_SECRET: dummy-secret
      BETTER_AUTH_URL: http://localhost:3000
      GITHUB_CLIENT_ID: dummy-client-id
      GITHUB_CLIENT_SECRET: dummy-client-secret
      RESEND_API_KEY: dummy-api-key
      RESEND_EMAIL_FROM: dummy@example.com
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm run generate

      - name: Run build
        run: pnpm run build
